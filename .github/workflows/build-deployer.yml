name: build-deployer

# 构建「中转站 Plus 一键部署器」三平台二进制（Windows/Linux/macOS × x86_64/arm64）
# 触发：push 到 main / 手动 / tag v*（tag 触发会将产物上传到 GitHub Release 附件）
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deployer:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            host_target: x86_64-pc-windows-msvc
            bin: relay-plus-deployer.exe
            out_name: relay-plus-deployer-win-x86_64.exe
          - name: windows-aarch64
            os: windows-latest
            host_target: aarch64-pc-windows-msvc
            bin: relay-plus-deployer.exe
            out_name: relay-plus-deployer-win-aarch64.exe
          - name: linux-x86_64
            os: ubuntu-latest
            host_target: x86_64-unknown-linux-gnu
            bin: relay-plus-deployer
            out_name: relay-plus-deployer-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-latest
            host_target: aarch64-unknown-linux-gnu
            bin: relay-plus-deployer
            out_name: relay-plus-deployer-linux-aarch64
          - name: macOS-aarch64
            os: macos-14
            host_target: aarch64-apple-darwin
            bin: relay-plus-deployer
            out_name: relay-plus-deployer-macos-aarch64
    defaults:
      run:
        working-directory: deployer
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.host_target }}

      # Linux 交叉编译需要目标架构的 gcc 链接器 + glibc 头文件
      - name: 安装 Linux 交叉编译工具链
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          if [ "${{ matrix.host_target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          else
            sudo apt-get install -y gcc
          fi

      # Windows aarch64：MSVC 侧需 llvm（提供 aarch64 链接器）/ 或直接不编 arm64 win（需 arm64 MSVC host）
      - name: 安装 Windows arm64 MSVC 工具链
        if: contains(matrix.name, 'windows-aarch64')
        shell: pwsh
        continue-on-error: true
        run: |
          choco install llvm -y --no-progress
          Write-Output "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" | Out-File -Append $env:GITHUB_ENV

      # gnu target 用 gcc 链接；指定交叉链接器到 CARGO_TARGET_*_LINKER
      - name: 设置交叉链接器
        if: contains(matrix.os, 'ubuntu')
        run: |
          if [ "${{ matrix.host_target }}" = "aarch64-unknown-linux-gnu" ]; then
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: cargo 交叉编译（release）
        run: cargo build --release --target ${{ matrix.host_target }}

      - name: 重命名产物
        shell: bash
        run: |
          cd "target/${{ matrix.host_target }}/release"
          cp "${{ matrix.bin }}" "${{ matrix.out_name }}"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: deployer/target/${{ matrix.host_target }}/release/${{ matrix.out_name }}
          if-no-files-found: error

  # tag 时：收集全部产物上传到 GitHub Release 附件（供下载用户直接使用）
  release:
    name: 打包装进 Release
    needs: deployer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 收集产物到 dist/
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f | while read f; do cp "$f" "dist/$(basename "$f")"; done
          ls -la dist/
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

  # Linux 端到端（E2E）验证：在真实 Linux 环境构建镜像 → 组装自包含 → 部署 → 登录 API 200
  # 保证 Linux 版本确实可用（每次 push / tag 自动回归）
  linux-e2e:
    name: linux-e2e（真实部署验证）
    runs-on: ubuntu-latest
    env:
      # compose 必填变量（构建镜像时解析 ${VAR:?} 需要）
      POSTGRES_PASSWORD: e2e_pg_pass_123
      JWT_SECRET: e2e_jwt_secret_12345678901234567890
      ADMIN_EMAIL: admin@e2e.local
      ADMIN_PASSWORD: e2e_admin_pass
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 编译 Linux 部署器（host x86_64）
        working-directory: deployer
        run: cargo build --release

      - name: 构建服务镜像
        run: |
          docker compose build
          docker images | grep -E 'plus-server|plus-web'

      - name: 组装 Linux 自包含单文件
        shell: bash
        run: |
          set -euo pipefail
          BIN=deployer/target/release/relay-plus-deployer
          test -x "$BIN"
          # 拉取 postgres 基础镜像（compose build 只构建 server/web，不会拉它）
          docker pull postgres:16-alpine
          # 导出并压缩镜像
          docker save plus-server:latest plus-web:latest postgres:16-alpine | gzip -9 > /tmp/emb.tar.gz
          # 组装 selfcontained（追加 marker + gzip 数据）
          pkg=/tmp/relay-plus-selfcontained-linux-e2e
          cp "$BIN" "$pkg"
          printf '\n==RELAY_PLUS_EMBED_BEGIN==\n' >> "$pkg"
          cat /tmp/emb.tar.gz >> "$pkg"
          chmod +x "$pkg"
          ls -la "$pkg"
          echo "E2E_BIN=$pkg" >> $GITHUB_ENV

      - name: 端到端部署（自包含 --yes）
        shell: bash
        run: |
          set -euo pipefail
          # 在空目录运行自包含单文件，--yes 免交互自动随机密钥
          cd /tmp
          rm -rf e2e-run && mkdir e2e-run && cd e2e-run
          cp "$E2E_BIN" ./relay-plus-selfcontained
          # 用较短的随机来跑：--yes 会生成随机 ≥8 密码，OK
          timeout 300 ./relay-plus-selfcontained --yes 2>&1 | tee deploy.log
          echo "--- 校验部署完成 ---"
          grep -q "部署完成" deploy.log || { echo "E2E 失败：未部署完成"; cat deploy.log; exit 1; }
          cat deploy.log

      - name: 用登录 API 验证服务正常（防 502）
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          echo "--- /healthz ---"
          curl -fsS -m 10 http://127.0.0.1:8082/healthz || { echo "healthz 失败(可能端口不同,查 .env)"; cat /tmp/e2e-run/.env; exit 1; }
          # 读取实际部署端口与管理员（--yes 生成)
          PORT=$(grep -E '^WEB_PORT=' /tmp/e2e-run/.env | cut -d= -f2)
          ADMIN=$(grep -E '^ADMIN_EMAIL=' /tmp/e2e-run/.env | cut -d= -f2)
          PW=$(grep -E '^ADMIN_PASSWORD=' /tmp/e2e-run/.env | cut -d= -f2)
          echo "PORT=$PORT ADMIN=$ADMIN PWlen=${#PW}"
          # 登录验证（防 502 / server 未就绪）
          BODY=$(printf '{"email":"%s","password":"%s"}' "$ADMIN" "$PW")
          CODE=$(curl -s -o /tmp/login.json -w '%{http_code}' -m 15 -X POST \
            -H 'Content-Type: application/json' \
            -d "$BODY" "http://127.0.0.1:${PORT}/api/v1/auth/login")
          echo "login http=$CODE"
          grep -q 'access_token' /tmp/login.json || { echo "E2E 失败：登录未返回 access_token"; cat /tmp/login.json; exit 1; }
          echo "E2E 通过：Linux 版本部署成功, 登录返回 access_token ✅"

