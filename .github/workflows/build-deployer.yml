name: build-deployer

# 构建「中转站 Plus 一键部署器」三平台二进制（Windows/Linux/macOS × x86_64/arm64）
# 触发：push 到 main / 手动 / tag v*（tag 触发会将产物上传到 GitHub Release 附件）
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deployer:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            host_target: x86_64-pc-windows-msvc
            bin: relay-plus-deployer.exe
            out_name: relay-plus-deployer-win-x86_64.exe
          - name: windows-aarch64
            os: windows-latest
            host_target: aarch64-pc-windows-msvc
            bin: relay-plus-deployer.exe
            out_name: relay-plus-deployer-win-aarch64.exe
          - name: linux-x86_64
            os: ubuntu-latest
            host_target: x86_64-unknown-linux-gnu
            bin: relay-plus-deployer
            out_name: relay-plus-deployer-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-latest
            host_target: aarch64-unknown-linux-gnu
            bin: relay-plus-deployer
            out_name: relay-plus-deployer-linux-aarch64
          - name: macOS-x86_64
            os: macos-13
            host_target: x86_64-apple-darwin
            bin: relay-plus-deployer
            out_name: relay-plus-deployer-macos-x86_64
          - name: macOS-aarch64
            os: macos-14
            host_target: aarch64-apple-darwin
            bin: relay-plus-deployer
            out_name: relay-plus-deployer-macos-aarch64
    defaults:
      run:
        working-directory: deployer
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.host_target }}

      # Linux 交叉编译需要目标架构的 gcc 链接器 + glibc 头文件
      - name: 安装 Linux 交叉编译工具链
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          if [ "${{ matrix.host_target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          else
            sudo apt-get install -y gcc
          fi

      # Windows aarch64：MSVC 侧需 llvm（提供 aarch64 链接器）/ 或直接不编 arm64 win（需 arm64 MSVC host）
      - name: 安装 Windows arm64 MSVC 工具链
        if: contains(matrix.name, 'windows-aarch64')
        shell: pwsh
        continue-on-error: true
        run: |
          choco install llvm -y --no-progress
          Write-Output "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" | Out-File -Append $env:GITHUB_ENV

      # gnu target 用 gcc 链接；指定交叉链接器到 CARGO_TARGET_*_LINKER
      - name: 设置交叉链接器
        if: contains(matrix.os, 'ubuntu')
        run: |
          if [ "${{ matrix.host_target }}" = "aarch64-unknown-linux-gnu" ]; then
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: cargo 交叉编译（release）
        run: cargo build --release --target ${{ matrix.host_target }}

      - name: 重命名产物
        shell: bash
        run: |
          cd "target/${{ matrix.host_target }}/release"
          cp "${{ matrix.bin }}" "${{ matrix.out_name }}"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: deployer/target/${{ matrix.host_target }}/release/${{ matrix.out_name }}
          if-no-files-found: error

  # tag 时：收集全部产物上传到 GitHub Release 附件（供下载用户直接使用）
  release:
    name: 打包装进 Release
    needs: deployer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 收集产物到 dist/
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f | while read f; do cp "$f" "dist/$(basename "$f")"; done
          ls -la dist/
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
