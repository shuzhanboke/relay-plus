[package]
name = "relay-plus-deployer"
version = "0.1.0"
edition = "2021"
description = "中转站 Plus 一键部署部署器（Windows / Linux / macOS，x86_64 / arm64）"
license = "MIT"

[dependencies]
# 跨平台安全随机数 / gzip 解压（自包含镜像段）。均为纯 Rust，交叉编译无障碍。
getrandom = "0.2"
flate2 = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
