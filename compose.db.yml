services:
  db:
    image: postgres:16-alpine
    container_name: relay-plus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: relay_plus
    ports:
      - "5432:5432"
    volumes:
      - relay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay_plus"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  relay_pgdata:
