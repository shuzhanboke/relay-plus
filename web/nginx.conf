# relay-plus web nginx reverse proxy config
# Serves the frontend build and proxies /api, /uploads, /v1, /healthz to the backend.
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 缓存策略（防止 SPA 白屏）----
    # index.html 永不缓存：每次强制回源拿最新 chunk 引用，避免引用已失效的旧 build
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 带 hash 的静态资源：内容寻址，可长缓存 immutable（不会白屏，hash 变即新 URL）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for non-file routes, avoid directory-walk redirect cycles
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # uploaded static assets (payment QR codes etc.)
    location /uploads/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
    }

    location /v1/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header openai-organization $http_openai_organization;
        proxy_set_header anthropic-version $http_anthropic_version;
        proxy_set_header anthropic-beta $http_anthropic_beta;
        proxy_set_header session_id $http_session_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location = /healthz {
        proxy_pass http://server:8080/healthz;
    }
}
